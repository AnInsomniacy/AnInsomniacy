# ---------------------------------------------------------------
# Workflow: Update README Stats Cards
# ---------------------------------------------------------------
# Generates github-readme-stats SVG cards as static assets via
# GitHub Actions, eliminating dependency on the public Vercel
# instance which suffers from rate-limiting and stale caches.
#
# Schedule: Runs every six hours and on manual dispatch.
# Output:   SVG files committed to the assets/ directory.
# ---------------------------------------------------------------

name: Update README Cards

on:
  schedule:
    - cron: "0 */6 * * *" # Every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
  workflow_dispatch:       # Allow manual trigger from Actions tab

concurrency:
  group: readme-cards-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate-cards:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # Stats Card
      # Shows total stars, commits, PRs, issues, and contributions
      # ----------------------------------------------------------
      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2
        with:
          card: stats
          options: "username=${{ github.repository_owner }}&show_icons=true&theme=tokyonight&include_all_commits=true&hide_border=true&disable_animations=true"
          path: assets/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          core_version: 2.1.5
          fail_on_error: true

      # ----------------------------------------------------------
      # Top Languages Card
      # Shows most-used programming languages across repositories
      # ----------------------------------------------------------
      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2
        with:
          card: top-langs
          options: "username=${{ github.repository_owner }}&layout=compact&langs_count=8&theme=tokyonight&hide_border=true&disable_animations=true"
          path: assets/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          core_version: 2.1.5
          fail_on_error: true

      # ----------------------------------------------------------
      # Pin Card — motrix-next
      # ----------------------------------------------------------
      - name: Generate pin card for motrix-next
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2
        with:
          card: pin
          options: "username=${{ github.repository_owner }}&repo=motrix-next&theme=tokyonight&hide_border=true&disable_animations=true"
          path: assets/pin-motrix-next.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          core_version: 2.1.5
          fail_on_error: true

      # ----------------------------------------------------------
      # Pin Card — tracknet-series-pytorch
      # ----------------------------------------------------------
      - name: Generate pin card for tracknet-series-pytorch
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2
        with:
          card: pin
          options: "username=${{ github.repository_owner }}&repo=tracknet-series-pytorch&theme=tokyonight&hide_border=true&disable_animations=true"
          path: assets/pin-tracknet.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          core_version: 2.1.5
          fail_on_error: true

      # ----------------------------------------------------------
      # Commit and push generated SVGs
      # ----------------------------------------------------------
      - name: Commit and push cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          git diff --staged --quiet || (git commit -m "chore: update readme stats cards" && git push)
