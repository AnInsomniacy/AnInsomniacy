name: Update profile stats

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/update-stats.yml

concurrency:
  group: profile-stats-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      STATS_OPTIONS: username=${{ github.repository_owner }}&show_icons=true&hide_rank=true&include_all_commits=true&card_width=400&line_height=25&hide_border=true&disable_animations=true&custom_title=Open-source%20activity
      LANGUAGE_OPTIONS: username=${{ github.repository_owner }}&layout=compact&langs_count=8&card_width=320&hide_border=true&disable_animations=true&custom_title=Languages
      LIGHT_COLORS: bg_color=ffffff00&title_color=172b4d&text_color=35465c&icon_color=0969da
      DARK_COLORS: bg_color=ffffff00&title_color=e6edf3&text_color=b7c6d9&icon_color=79b8ff

    steps:
      - name: Check out profile
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Generate light stats
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2
        with:
          card: stats
          options: ${{ env.STATS_OPTIONS }}&${{ env.LIGHT_COLORS }}
          path: assets/stats-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          core_version: 2.1.5
          fail_on_error: true

      - name: Generate dark stats
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2
        with:
          card: stats
          options: ${{ env.STATS_OPTIONS }}&${{ env.DARK_COLORS }}
          path: assets/stats-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          core_version: 2.1.5
          fail_on_error: true

      - name: Generate light languages
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2
        with:
          card: top-langs
          options: ${{ env.LANGUAGE_OPTIONS }}&${{ env.LIGHT_COLORS }}
          path: assets/languages-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          core_version: 2.1.5
          fail_on_error: true

      - name: Generate dark languages
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2
        with:
          card: top-langs
          options: ${{ env.LANGUAGE_OPTIONS }}&${{ env.DARK_COLORS }}
          path: assets/languages-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          core_version: 2.1.5
          fail_on_error: true

      # The default success condition keeps partial or failed updates out of Git.
      - name: Commit refreshed stats
        run: |
          git add assets/stats-{light,dark}.svg assets/languages-{light,dark}.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh profile stats"
          git push
