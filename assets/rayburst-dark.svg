<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="The Rayburst stack: Rayburst Connect (browser extension) hands downloads to Rayburst (desktop app), which runs on the Aria2 Next engine."><title>The Rayburst stack: Rayburst Connect (browser extension) hands downloads to Rayburst (desktop app), which runs on the Aria2 Next engine.</title><style>@font-face{font-family:'JBM';src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'IS';src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'INT';src:url(data:font/woff2;base64,) format('woff2');}@keyframes pk{0%{transform:translateX(0);opacity:0}15%,85%{opacity:1}100%{transform:translateX(30px);opacity:0}}.pk{animation:pk 1.6s linear infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><clipPath id="card"><rect width="1200" height="420" rx="20"/></clipPath></defs><g clip-path="url(#card)"><rect width="1200" height="420" fill="#0b0e15"/><text x="48.0" y="64.0" font-family="JBM" font-size="17" fill="#6c7586" text-anchor="start" letter-spacing="2.38" >THE RAYBURST STACK</text><text x="1152.0" y="64.0" font-family="JBM" font-size="17" fill="#6c7586" text-anchor="end" >browser → desktop → engine → internet</text><rect x="48" y="100" width="340" height="216" rx="16" fill="#121723" stroke="#272e3d" stroke-width="1"/><text x="76.0" y="142.0" font-family="JBM" font-size="15" fill="#6c7586" text-anchor="start" letter-spacing="1.80" >BROWSER EXTENSION</text><text x="74.0" y="196.0" font-family="IS" font-size="46" fill="#e8ebf1" text-anchor="start" >Rayburst Connect</text><text x="76.0" y="234.0" font-family="INT" font-size="20" fill="#aeb6c3" text-anchor="start" >Hands browser downloads</text><text x="76.0" y="260.0" font-family="INT" font-size="20" fill="#aeb6c3" text-anchor="start" >and page media over.</text><text x="76.0" y="294.0" font-family="JBM" font-size="15" fill="#6c7586" text-anchor="star